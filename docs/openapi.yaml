openapi: 3.0.3
info:
  title: Perso Marketplace API
  description: 'Backend API for Perso — Intelligent Telegram marketplace monitoring and product-price
    discovery platform. Initial focus: Iranian electronic marketplace.


    Identity checkpoint: password accounts and server-side sessions; buyer marketplace access is scoped by live
    source assignments from step 3B.'
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Local development server
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
      security: []
  /ready:
    get:
      summary: Readiness probe (database and queue connectivity)
      operationId: getReady
      responses:
        '200':
          description: All dependencies are up and ready
        '503':
          description: One or more dependencies are down
      security: []
  /api/v1/interests:
    get:
      summary: List user interests
      operationId: listInterests
      responses:
        '200':
          description: List of registered product interests
    post:
      summary: Add a product to user interest list
      operationId: createInterest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - product_id
              properties:
                product_id:
                  type: string
                  format: uuid
                max_price_amount:
                  type: integer
                  minimum: 0
                min_quantity:
                  type: integer
                  minimum: 1
                preferred_city:
                  type: string
                required_attributes:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: 'Interest created (Phase 1: buy_enabled=true, sell_enabled=false)'
      security:
      - sessionCookie: []
        csrfToken: []
  /api/v1/interests/{id}:
    patch:
      summary: Update personal healthcare interest filters
      operationId: updateInterest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInterestRequest'
      responses:
        '200':
          description: Interest filters updated
        '400':
          description: Invalid filter values
        '404':
          description: Interest not found or not owned by the user
      security:
      - sessionCookie: []
        csrfToken: []
    delete:
      summary: Remove product from interest list
      operationId: deleteInterest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Interest deleted
      security:
      - sessionCookie: []
        csrfToken: []
  /api/v1/watch-sources:
    get:
      summary: List monitored Telegram groups and channels
      operationId: listWatchSources
      responses:
        '200':
          description: List of watch sources
    post:
      summary: Add Telegram channel or group to watch list
      operationId: createWatchSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - telegram_chat_id
              - title
              properties:
                telegram_chat_id:
                  type: integer
                  format: int64
                title:
                  type: string
                username:
                  type: string
                source_type:
                  type: string
                  enum:
                  - channel
                  - group
                  - supergroup
      responses:
        '201':
          description: 'Watch source added (Phase 1: buy_enabled=true, sell_enabled=false)'
      security:
      - sessionCookie: []
        csrfToken: []
  /api/v1/watch-sources/{id}:
    delete:
      summary: Remove Telegram source from watch list
      operationId: deleteWatchSource
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Watch source deleted
      security:
      - sessionCookie: []
        csrfToken: []
  /api/v1/products:
    get:
      summary: List canonical products
      operationId: listProducts
      parameters:
      - name: search
        in: query
        schema:
          type: string
      - name: category
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Products catalog list
    post:
      summary: Create a healthcare catalog product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
        '403':
          description: Administrator access required
      security:
      - sessionCookie: []
        csrfToken: []
  /api/v1/products/{id}:
    get:
      summary: Get product details with aliases
      operationId: getProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Product details
    patch:
      summary: Update a healthcare catalog product
      operationId: updateProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Product updated
        '403':
          description: Administrator access required
        '404':
          description: Product not found
      security:
      - sessionCookie: []
        csrfToken: []
  /api/v1/products/{id}/statistics:
    get:
      summary: Get calculated price statistics and distribution for a product
      operationId: getProductStatistics
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Price statistics (min, max, average, median, range, distribution, trend)
  /api/v1/offers:
    get:
      summary: List seller offers
      operationId: listOffers
      parameters:
      - name: product_id
        in: query
        schema:
          type: string
          format: uuid
      - name: brand
        in: query
        schema:
          type: string
      - name: condition
        in: query
        schema:
          type: string
      - name: min_price
        in: query
        schema:
          type: integer
      - name: max_price
        in: query
        schema:
          type: integer
      - name: sort_by
        in: query
        schema:
          type: string
          enum:
          - lowest_price
          - highest_price
          - newest
          - best_offer
          - confidence
          - freshness
      - name: with_scores
        in: query
        schema:
          type: boolean
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: List of seller offers
  /api/v1/offers/{id}:
    get:
      summary: Get offer by ID with explainable score breakdown
      operationId: getOffer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Offer details with score breakdown
  /api/v1/conversations:
    get:
      summary: List conversation outreach workflows
      operationId: listConversations
      parameters:
      - name: state
        in: query
        schema:
          type: string
          enum:
          - NEW
          - AWAITING_APPROVAL
          - AWAITING_CONSENT
          - ACTIVE
          - WAITING_FOR_REPLY
          - COMPLETED
          - DECLINED
          - OPTED_OUT
          - PAUSED
      - name: limit
        in: query
        schema:
          type: integer
      - name: offset
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: List of conversations
  /api/v1/conversations/{id}:
    get:
      summary: Get conversation state and full message history
      operationId: getConversation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Conversation state and chat history
  /api/v1/conversations/{id}/approve:
    post:
      summary: Approve seller outreach conversation draft (human review gate)
      operationId: approveConversation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Conversation approved and activated
      security:
      - sessionCookie: []
        csrfToken: []
  /api/v1/conversations/{id}/pause:
    post:
      summary: Pause an ongoing conversation
      operationId: pauseConversation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Conversation paused
      security:
      - sessionCookie: []
        csrfToken: []
  /api/v1/conversations/{id}/close:
    post:
      summary: Close/complete a conversation
      operationId: closeConversation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Conversation closed
      security:
      - sessionCookie: []
        csrfToken: []
  /api/v1/dashboard/summary:
    get:
      summary: Marketplace dashboard summary metrics
      operationId: getDashboardSummary
      responses:
        '200':
          description: Overall metrics summary
  /api/v1/analytics/prices:
    get:
      summary: Price analytics and 30-day historical trend for product
      operationId: getPriceAnalytics
      parameters:
      - name: product_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Price analytics and historical observations
  /api/v1/analytics/offers:
    get:
      summary: Best-ranked deals and marketplace offers overview
      operationId: getOfferAnalytics
      responses:
        '200':
          description: Top deals and offers overview
  /api/v1/sources/resolve:
    post:
      summary: Resolve and detect Telegram entity type and capabilities
      operationId: resolveSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveSourceRequest'
      responses:
        '200':
          description: Resolved Telegram source metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveSourceResponse'
      security:
      - sessionCookie: []
        csrfToken: []
  /api/v1/sources:
    get:
      summary: List configured Telegram sources
      operationId: listTelegramSources
      responses:
        '200':
          description: List of Telegram sources
    post:
      summary: Register and verify a Telegram source
      operationId: createTelegramSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTelegramSourceRequest'
      responses:
        '201':
          description: Source registered successfully
      security:
      - sessionCookie: []
        csrfToken: []
  /api/v1/sources/{id}:
    get:
      summary: Get Telegram source details
      operationId: getTelegramSource
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Source details
    delete:
      summary: Delete a Telegram source
      operationId: deleteTelegramSource
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Source deleted
      security:
      - sessionCookie: []
        csrfToken: []
  /api/v1/sources/{id}/capabilities:
    get:
      summary: Get Telegram source capabilities
      operationId: getSourceCapabilities
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ingestion capabilities
  /api/v1/sources/{id}/status:
    put:
      summary: Update source ingestion status
      operationId: updateSourceStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTelegramSourceStatusRequest'
      responses:
        '200':
          description: Status updated
        '409':
          description: Resolve source capabilities with the connected Telegram account before resuming
      security:
      - sessionCookie: []
        csrfToken: []
  /api/v1/matches:
    get:
      summary: List matched buying opportunities for the user
      operationId: listMatches
      responses:
        '200':
          description: List of matched seller offers with explanations
  /api/v1/analytics/comparisons/condition:
    get:
      summary: Price comparison by condition
      operationId: compareCondition
      parameters:
      - name: product_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Condition price comparison
  /api/v1/analytics/comparisons/city:
    get:
      summary: Price comparison by seller city
      operationId: compareCity
      parameters:
      - name: product_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: City price comparison
  /api/v1/analytics/comparisons/brand:
    get:
      summary: Price comparison across marketplace brands
      operationId: compareBrand
      responses:
        '200':
          description: Brand price comparison
  /api/v1/session:
    get:
      summary: Current authenticated operator and capabilities
      operationId: getSession
      responses:
        '200':
          description: Session identity
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success: &id011
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Session'
        '401':
          description: Authentication required
  /api/v1/telegram/status:
    get:
      summary: Status of the account-owning Telegram gateway
      operationId: getTelegramStatus
      responses:
        '200':
          description: Connected and mock flags
        '503':
          description: Gateway unavailable
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate with username/password and set HttpOnly session cookie
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/LoginResult'
        '400':
          description: Invalid input
        '401':
          description: Sign in required
        '403':
          description: Insufficient permission or invalid CSRF/origin
        '409':
          description: Duplicate identity or last-super-admin conflict
        '429':
          description: Login rate limit
        '503':
          description: Storage unavailable
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                username:
                  type: string
                password:
                  type: string
                  writeOnly: true
              required:
              - username
              - password
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke current session and clear cookie
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '400':
          description: Invalid input
        '401':
          description: Sign in required
        '403':
          description: Insufficient permission or invalid CSRF/origin
        '409':
          description: Duplicate identity or last-super-admin conflict
        '429':
          description: Login rate limit
        '503':
          description: Storage unavailable
      security:
      - sessionCookie: []
        csrfToken: []
  /api/v1/me:
    get:
      operationId: getMe
      summary: Get current account
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Account'
        '400':
          description: Invalid input
        '401':
          description: Sign in required
        '403':
          description: Insufficient permission or invalid CSRF/origin
        '409':
          description: Duplicate identity or last-super-admin conflict
        '429':
          description: Login rate limit
        '503':
          description: Storage unavailable
    patch:
      operationId: updateProfile
      summary: Update own profile; role/status changes forbidden
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Account'
        '400':
          description: Invalid input
        '401':
          description: Sign in required
        '403':
          description: Insufficient permission or invalid CSRF/origin
        '409':
          description: Duplicate identity or last-super-admin conflict
        '429':
          description: Login rate limit
        '503':
          description: Storage unavailable
      security:
      - sessionCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                username: &id001
                  type: string
                  pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{2,63}$
                email: &id002
                  type: string
                  maxLength: 254
                full_name: &id003
                  type: string
                  maxLength: 200
              required: []
  /api/v1/me/preferences:
    get:
      operationId: getPreferences
      summary: Get own preferences
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Preferences'
        '400':
          description: Invalid input
        '401':
          description: Sign in required
        '403':
          description: Insufficient permission or invalid CSRF/origin
        '409':
          description: Duplicate identity or last-super-admin conflict
        '429':
          description: Login rate limit
        '503':
          description: Storage unavailable
    patch:
      operationId: updatePreferences
      summary: Partially update own preferences
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Preferences'
        '400':
          description: Invalid input
        '401':
          description: Sign in required
        '403':
          description: Insufficient permission or invalid CSRF/origin
        '409':
          description: Duplicate identity or last-super-admin conflict
        '429':
          description: Login rate limit
        '503':
          description: Storage unavailable
      security:
      - sessionCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              additionalProperties: false
              properties: &id013
                language:
                  type: string
                  enum:
                  - fa
                  - en
                preferred_city:
                  type: string
                  maxLength: 100
                preferred_area:
                  type: string
                  maxLength: 100
                default_sort:
                  type: string
                  enum:
                  - best_offer
                  - lowest_price
                  - highest_price
                  - newest
                number_format:
                  type: string
                  enum:
                  - locale
                  - latin
  /api/v1/me/password:
    post:
      operationId: changePassword
      summary: Verify current password and revoke all own sessions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '400':
          description: Invalid input
        '401':
          description: Sign in required
        '403':
          description: Insufficient permission or invalid CSRF/origin
        '409':
          description: Duplicate identity or last-super-admin conflict
        '429':
          description: Login rate limit
        '503':
          description: Storage unavailable
      security:
      - sessionCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                current_password:
                  type: string
                  writeOnly: true
                password: &id004
                  type: string
                  minLength: 12
                  maxLength: 72
                  writeOnly: true
                  description: 12–72 UTF-8 bytes enforced by backend
              required:
              - current_password
              - password
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List up to 200 accounts; admins see buyers only
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
        '400':
          description: Invalid input
        '401':
          description: Sign in required
        '403':
          description: Insufficient permission or invalid CSRF/origin
        '409':
          description: Duplicate identity or last-super-admin conflict
        '429':
          description: Login rate limit
        '503':
          description: Storage unavailable
    post:
      operationId: createUser
      summary: Create account; only super_admin may assign elevated roles
      responses:
        '400':
          description: Invalid input
        '401':
          description: Sign in required
        '403':
          description: Insufficient permission or invalid CSRF/origin
        '409':
          description: Duplicate identity or last-super-admin conflict
        '429':
          description: Login rate limit
        '503':
          description: Storage unavailable
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Account'
      security:
      - sessionCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                username: *id001
                email: *id002
                full_name: *id003
                role:
                  type: string
                  enum: &id005
                  - super_admin
                  - admin
                  - buyer
                password: *id004
              required:
              - username
              - password
              - role
  /api/v1/users/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getUser
      summary: Get an administratively manageable account
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Account'
        '400':
          description: Invalid input
        '401':
          description: Sign in required
        '403':
          description: Insufficient permission or invalid CSRF/origin
        '409':
          description: Duplicate identity or last-super-admin conflict
        '429':
          description: Login rate limit
        '503':
          description: Storage unavailable
    patch:
      operationId: updateUser
      summary: Edit account, preserve last active super admin, revoke sessions on role/status changes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Account'
        '400':
          description: Invalid input
        '401':
          description: Sign in required
        '403':
          description: Insufficient permission or invalid CSRF/origin
        '409':
          description: Duplicate identity or last-super-admin conflict
        '429':
          description: Login rate limit
        '503':
          description: Storage unavailable
      security:
      - sessionCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                username: *id001
                email: *id002
                full_name: *id003
                role:
                  type: string
                  enum: *id005
                active:
                  type: boolean
              required: []
  /api/v1/users/{id}/reset-password:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: resetPassword
      summary: Administrative password reset revokes all target sessions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '400':
          description: Invalid input
        '401':
          description: Sign in required
        '403':
          description: Insufficient permission or invalid CSRF/origin
        '409':
          description: Duplicate identity or last-super-admin conflict
        '429':
          description: Login rate limit
        '503':
          description: Storage unavailable
      security:
      - sessionCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password: *id004
              required:
              - password
  /api/v1/operations/status:
    get:
      operationId: operationsStatus
      summary: Aggregate gateway status for read-only monitoring; no browser account privileges
      security:
      - operationsToken: []
      responses:
        '200':
          description: Aggregate gateway state
        '401':
          description: Invalid machine token
        '503':
          description: Gateway unavailable
  /api/v1/sources/{id}/assignments:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getSourceAssignments
      summary: Read explicit workspace source grants (admin/super_admin)
      security:
      - sessionCookie: []
      responses: &id006
        '200':
          description: Current explicit grants; buyer marketplace access is controlled by these live grants.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SourceAssignments'
        '400':
          description: Invalid ID/body, duplicate/excess IDs, inactive or non-buyer account
        '401':
          description: Authentication required
        '403':
          description: Administrator role or CSRF/origin required
        '404':
          description: Unknown or removed source
        '409':
          description: Assignment version changed; reload before replacement
        '415':
          description: JSON required
        '503':
          description: Storage unavailable
    put:
      operationId: replaceSourceAssignments
      summary: Atomically replace grants for active buyers (admin/super_admin)
      security:
      - sessionCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceAssignmentsUpdate'
      responses: *id006
